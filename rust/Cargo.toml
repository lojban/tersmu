[package]
name = "camxes-rs"
version = "1.0.0"
edition = "2021"
description = "Lojban PEG parser with semantic analysis - integrated camxes parser and tersmu semantic engine"
license = "GPL-3.0"
repository = "https://github.com/lojban/tersmu"
homepage = "https://github.com/lojban/tersmu"
documentation = "https://docs.rs/camxes-rs"
keywords = ["lojban", "parser", "peg", "semantic", "linguistics"]
categories = ["parsing", "text-processing"]
authors = ["lagleki"]

[[bin]]
name = "camxes"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"
once_cell = "1.21"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11.8"

[lib]
name = "camxes_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "camxes_parser"
path = "benches/camxes_parser.rs"
harness = false
